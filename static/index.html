<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline Dashboard</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       background:#0f0f11;color:#e4e4e7;font-size:14px;line-height:1.5}

  header{background:#1a1a1e;border-bottom:1px solid #27272a;padding:12px 20px;
         display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  h1{font-size:18px;font-weight:600;color:#fafafa}
  .badge{background:#27272a;color:#a1a1aa;border-radius:999px;padding:2px 10px;font-size:13px}
  #lastUpdate{margin-left:auto;color:#52525b;font-size:12px}
  .subhead{color:#52525b;font-size:12px}
  .live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;
            margin-right:6px;vertical-align:middle;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .hdr-actions{display:flex;gap:6px;align-items:center}

  .btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;
       border:1px solid #27272a;background:#1f1f23;color:#a1a1aa;font-size:11px;cursor:pointer;
       transition:all .15s;font-family:inherit;line-height:1.4}
  .btn:hover{border-color:#3f3f46;color:#d4d4d8}
  .btn-del{border-color:#7f1d1d20;color:#a1a1aa}
  .btn-del:hover{border-color:#ef4444;color:#ef4444;background:#450a0a}
  .btn-del.confirm{border-color:#ef4444;background:#450a0a;color:#fca5a5;font-weight:600}
  .btn-arch{border-color:#27272a;color:#a1a1aa}
  .btn-arch:hover{border-color:#78716c;color:#d6d3d1}
  .btn-run{border-color:#27272a}
  .btn-run:hover{border-color:#22c55e;color:#4ade80}
  .btn-sm{padding:2px 7px;font-size:11px}

  main{max-width:820px;margin:0 auto;padding:12px 16px}

  .card{background:#18181b;border:1px solid #27272a;border-radius:10px;margin-bottom:10px;overflow:hidden}
  .card.has-running{border-color:#f59e0b55}
  .card.all-done{opacity:.5}
  .card.all-done:hover{opacity:.8}

  .ch{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
  .ch:hover{background:#1f1f23}
  .ch .ch-title{flex:1;font-weight:500;color:#f4f4f5;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .ch-pid{color:#52525b;font-size:11px;font-family:monospace;flex-shrink:0}
  .ch .ch-progress{font-size:12px;color:#a1a1aa;white-space:nowrap;flex-shrink:0}
  .ch .ch-toggle{color:#52525b;font-size:16px;width:18px;text-align:center;flex-shrink:0}

  .pb-wrap{height:3px;background:#27272a;margin:0 14px;border-radius:2px;overflow:hidden}
  .pb-fill{height:100%;border-radius:2px;transition:width .6s ease}
  .pb-wrap.running .pb-fill{background:linear-gradient(90deg,#f59e0b,#fbbf24,#f59e0b);background-size:200% 100%;
                             animation:shimmer 2s infinite linear}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .body{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .body.open{max-height:5000px}

  .pane{padding:0 14px 12px}

  /* action toolbar per card */
  .act-row{display:flex;gap:5px;padding:6px 0 8px;flex-wrap:wrap;border-top:1px solid #1f1f23;margin-top:6px}

  /* agent flow row */
  .flow{display:flex;align-items:center;gap:6px;padding:6px 9px;margin-bottom:6px;border-radius:6px;
        background:#131316;font-size:12px;flex-wrap:wrap}
  .flow-step{display:flex;align-items:center;gap:4px}
  .flow-arrow{color:#3f3f46;font-size:12px}
  .flow-step .fs-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .flow-step .fs-name{color:#a1a1aa}
  .flow-step.done .fs-name{color:#4ade80;font-weight:500}
  .flow-step.running .fs-name{color:#fbbf24;font-weight:600}
  .flow-step.running .fs-dot{animation:pulse 1.2s infinite}
  .flow-step.todo .fs-name{color:#52525b}
  .flow-step.blocked .fs-name{color:#f87171}
  .flow-step.ready .fs-name{color:#93c5fd}

  .ag{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:13px}
  .ag:hover{background:#1f1f23}
  .ag .ag-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .ag .ag-dot.running-pulse{animation:pulse 1s infinite}
  .ag .ag-name{font-weight:500;flex-shrink:0;min-width:74px;color:#d4d4d8}
  .ag .ag-task{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e4e4e7}
  .ag .ag-status{font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;flex-shrink:0}
  .ag .ag-s-running{background:#f59e0b22;color:#fbbf24}
  .ag .ag-s-done{background:#22c55e22;color:#4ade80}
  .ag .ag-s-todo{background:#27272a;color:#a1a1aa}
  .ag .ag-s-ready{background:#3b82f622;color:#93c5fd}
  .ag .ag-s-blocked{background:#ef444422;color:#f87171}
  .ag .ag-s-triage{background:#27272a;color:#94a3b8}
  .ag .ag-time{color:#52525b;font-size:11px;flex-shrink:0}
  .ag .ag-heartbeat{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;vertical-align:middle}

  .empty{text-align:center;padding:60px 20px;color:#52525b}
  .empty small{display:block;margin-top:6px;font-size:13px;color:#3f3f46}

  .toast{position:fixed;bottom:20px;right:20px;background:#18181b;border:1px solid #27272a;
         border-radius:8px;padding:10px 16px;font-size:13px;z-index:100;
         box-shadow:0 4px 16px #00000066;animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .toast.err{border-color:#ef4444;color:#fca5a5}
  .toast.ok{border-color:#22c55e;color:#86efac}
  .toast span{margin-left:8px;color:#52525b;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<header>
  <span class="live-dot"></span>
  <h1>Pipeline</h1>
  <span class="badge" id="countBadge">0</span>
  <span class="subhead" id="runningInfo"></span>
  <div class="hdr-actions">
    <button class="btn btn-sm" onclick="expandAll()" title="Развернуть все">Развернуть</button>
    <button class="btn btn-sm" onclick="collapseAll()" title="Свернуть все">Свернуть</button>
    <button class="btn btn-arch" onclick="archiveAllDone()">Архивировать выполненные</button>
  </div>
  <span id="lastUpdate"></span>
</header>
<main id="app"><div class="empty">Загрузка...</div></main>

<script>
const LABEL={triage:'Triage',todo:'Todo',ready:'Ready',running:'Running',blocked:'Blocked',done:'Done',archived:'Archived'};
const COLOR={triage:'#94a3b8',todo:'#64748b',ready:'#3b82f6',running:'#f59e0b',blocked:'#ef4444',done:'#22c55e',archived:'#78716c'};
const app=document.getElementById('app');
const countBadge=document.getElementById('countBadge');
const runningInfo=document.getElementById('runningInfo');
const lastUpdate=document.getElementById('lastUpdate');
let allTasks=[],expanded=new Set();
let deletePending={}; // task_id -> setTimeout id

function esc(s){return(''+s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]||c)}

function ago(ts){
  if(!ts)return'';
  const s=Math.floor(Date.now()/1000-ts);
  if(s<0)return'только что';
  if(s<60)return s+'с';const m=Math.floor(s/60);
  if(m<60)return m+'м';const h=Math.floor(m/60);
  return h+'ч '+m%60+'м';
}
function fmtTime(ts){
  if(!ts)return'';
  return new Date(ts*1000).toLocaleTimeString();
}
function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'ok');
  el.innerHTML=msg+' <span onclick="this.parentElement.remove()">✕</span>';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),4000);
}

async function api(method,path){
  try{
    const r=await fetch(path,{method});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'API error');
    return d;
  }catch(e){
    toast('Ошибка: '+e.message,'err');
    throw e;
  }
}

async function deleteTask(id){
  if(deletePending[id]){
    clearTimeout(deletePending[id]);
    delete deletePending[id];
    const result=await api('DELETE','/api/tasks/'+id+'/delete');
    toast('Удалено: '+id,'ok');
    return result;
  }
  // First click — arm
  deletePending[id]=setTimeout(()=>{delete deletePending[id];render();},4000);
  toast('Нажмите ещё раз для подтверждения удаления','');
  render();
}

async function archiveTask(id){
  const result=await api('POST','/api/tasks/'+id+'/archive');
  toast('Архивировано: '+id,'ok');
}

async function rerunTask(id){
  const result=await api('POST','/api/tasks/'+id+'/rerun');
  toast('Сброшено для перезапуска: '+id,'ok');
}

async function resetTask(id){
  const result=await api('POST','/api/tasks/'+id+'/reset');
  toast('Сброшено: '+id,'ok');
}

async function archiveAllDone(){
  const done=allTasks.filter(t=>t.status==='done');
  if(!done.length){toast('Нет выполненных','');return}
  for(const t of done)await archiveTask(t.id);
  toast('Архивировано: '+done.length,'ok');
}

function render(){
  let rcount=0;
  let html='';
  for(const p of allTasks){
    const isDone=p.status==='done';
    const color=COLOR[p.status]||'#64748b';
    const pr=p.progress||{};
    const pct=pr.pct||0;
    const txt=pr.done+'/'+pr.total;
    const hasRunning=pr.running>0;
    if(p.status==='running')rcount++;
    const open=expanded.has(p.id);
    const arrow=open?'▾':'▸';

    const pendingDelete=deletePending[p.id];

    html+='<div class="card'+(hasRunning?' has-running':'')+(isDone?' all-done':'')+'">';
    html+='<div class="ch" onclick="toggle(\''+esc(p.id)+'\')">';
    html+='<span class="status-dot" style="background:'+color+'"></span>';
    html+='<span class="ch-title">'+esc(p.title)+'</span>';
    html+='<span class="ch-pid">'+esc(p.id)+'</span>';
    html+='<span class="ch-progress">'+txt+'</span>';
    html+='<span class="ch-toggle">'+arrow+'</span>';
    html+='</div>';
    html+='<div class="pb-wrap'+(p.status==='running'||hasRunning?' running':'')+'"><div class="pb-fill" style="width:'+pct+'%"></div></div>';

    html+='<div class="body'+(open?' open':'')+'"><div class="pane">';

    // Agent flow mini pipeline
    if(p.agent_flow&&p.agent_flow.length){
      html+='<div class="flow">';
      const childMap={};
      if(p.children)for(const c of p.children)childMap[c.assignee]=c;
      for(let i=0;i<p.agent_flow.length;i++){
        if(i>0)html+='<span class="flow-arrow">→</span>';
        const agent=p.agent_flow[i];
        const child=childMap[agent];
        const st=child?child.status:'todo';
        html+='<span class="flow-step '+st+'">';
        html+='<span class="fs-dot" style="background:'+(COLOR[st]||'#64748b')+'"></span>';
        html+='<span class="fs-name">'+esc(agent)+'</span>';
        if(child&&st==='done')html+='<span style="color:#4ade80;font-size:11px">✓</span>';
        html+='</span>';
      }
      html+='</div>';
    }

    // Agent detail rows
    if(p.children&&p.children.length){
      for(const c of p.children){
        const cc=COLOR[c.status]||'#64748b';
        const agent=c.assignee&&c.assignee.startsWith('@')?c.assignee:c.assignee||'—';
        const taskTitle=c.title.replace(/^@\w+:\s*/,'');
        const run=c.run;
        const isRunningNow=c.status==='running';
        if(isRunningNow)rcount++;

        let timeStr='';
        if(isRunningNow&&run&&run.started_at)timeStr=ago(run.started_at);
        else if(c.status==='done'&&c.completed_at)timeStr='✓ '+ago(c.completed_at);
        else if(c.status==='blocked'&&run&&run.started_at)timeStr=ago(run.started_at);

        let hb='';
        if(isRunningNow&&run){
          const hbts=run.last_heartbeat_at||c.last_heartbeat_at;
          if(hbts){
            const secAgo=Math.floor(Date.now()/1000-hbts);
            const hbColor=secAgo<30?'#22c55e':secAgo<120?'#f59e0b':'#ef4444';
            hb='<span class="ag-heartbeat" style="background:'+hbColor+';animation:pulse '+(secAgo<30?'1.5s':'3s')+' infinite" title="heartbeat '+ago(hbts)+'"></span>';
          }else hb='<span class="ag-heartbeat" style="background:#3f3f46" title="нет heartbeat"></span>';
        }

        let summary='';
        if(run&&run.summary&&(c.status==='done'||c.status==='blocked')){
          const s=run.summary;
          summary='<span style="color:#71717a;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle" title="'+esc(s)+'">'+esc(s.length>40?s.slice(0,40)+'…':s)+'</span>';
        }

        html+='<div class="ag">';
        html+='<span class="ag-dot'+(isRunningNow?' running-pulse':'')+'" style="background:'+cc+'"></span>';
        html+='<span class="ag-name">'+esc(agent)+'</span>';
        html+='<span class="ag-task">'+esc(taskTitle)+'</span>';
        html+='<span class="ag-status ag-s-'+c.status+'">'+(LABEL[c.status]||c.status)+'</span>';
        html+=hb;
        if(timeStr)html+='<span class="ag-time">'+timeStr+'</span>';
        if(summary)html+=summary;
        if(isRunningNow&&run&&run.worker_pid)html+='<span style="color:#3f3f46;font-size:10px;font-family:monospace">pid:'+run.worker_pid+'</span>';
        html+='</div>';
      }
    }else{
      html+='<div style="color:#52525b;padding:4px 0;font-size:12px">Нет дочерних задач</div>';
    }

    // Action buttons row per card
    html+='<div class="act-row">';
    // Delete button
    html+='<button class="btn btn-del'+(pendingDelete?' confirm':'')+'" onclick="deleteTask(\''+esc(p.id)+'\')" '+(pendingDelete?'title="Нажмите ещё раз для удаления"':'')+'>'+(pendingDelete?'Уверен?':'Удалить')+'</button>';
    // Archive button
    html+='<button class="btn btn-arch" onclick="archiveTask(\''+esc(p.id)+'\')">Архив</button>';
    // Rerun button
    html+='<button class="btn btn-run" onclick="rerunTask(\''+esc(p.id)+'\')">Перезапустить</button>';
    // Reset button
    html+='<button class="btn" onclick="resetTask(\''+esc(p.id)+'\')">Сброс</button>';
    html+='</div>';

    html+='</div></div></div>';
  }
  if(!allTasks.length){
    html='<div class="empty">Нет активных pipeline-задач</div>';
  }
  app.innerHTML=html;
  countBadge.textContent=allTasks.length;
  const runTotal=allTasks.reduce((s,p)=>s+(p.progress?.running||0),0);
  runningInfo.textContent=runTotal?'Выполняется: '+runTotal:'';
  lastUpdate.textContent=fmtTime(Math.floor(Date.now()/1000));
}

window.toggle=function(id){
  if(expanded.has(id))expanded.delete(id);else expanded.add(id);
  render();
};

function connectSSE(){
  const es=new EventSource('/api/events');
  es.addEventListener('full_update',e=>{
    try{
      const data=JSON.parse(e.data);
      if(!allTasks.length){
        expanded=new Set();
        for(const p of data)if(p.status==='running'||p.status==='ready'||p.status==='blocked')expanded.add(p.id);
      }else{
        const oldMap={};for(const t of allTasks)oldMap[t.id]=t.status;
        for(const p of data){
          if(p.status!=='done'&&oldMap[p.id]==='done')expanded.add(p.id);
        }
      }
      allTasks=data;
      // Clear delete pending for tasks no longer present
      for(const id in deletePending){
        if(!data.find(t=>t.id===id)){
          clearTimeout(deletePending[id]);
          delete deletePending[id];
        }
      }
      render();
    }catch(err){console.error(err)}
  });
  es.addEventListener('error',()=>{es.close();setTimeout(connectSSE,3000)});
}
connectSSE();

fetch('/api/tasks').then(r=>r.json()).then(data=>{
  expanded=new Set();
  for(const p of data)if(p.status==='running'||p.status==='ready'||p.status==='blocked')expanded.add(p.id);
  allTasks=data;render();
}).catch(()=>{
  app.innerHTML='<div class="empty">Ошибка подключения к серверу</div>';
});

function expandAll(){
  for(const p of allTasks)expanded.add(p.id);
  render();
}
function collapseAll(){
  expanded=new Set();
  render();
}
</script>
</body>
</html>
