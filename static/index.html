<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Dashboard</title>
<style>:root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#24243a;--border:#2e2e48;--text:#e0e0f0;--text-dim:#8888aa;--accent:#7c6ff0;--green:#50d890;--yellow:#faca4e;--red:#ff6b6b;--blue:#6cb6ff;--orange:#ffa050}*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.5}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}.header h1 span{color:var(--accent)}.header .status-bar{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-dim)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;transition:all .3s}
.conn-online{background:var(--green);box-shadow:0 0 6px var(--green)}.conn-offline{background:var(--red)}.conn-pending{background:var(--yellow);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.layout{display:flex;height:calc(100vh - 53px);overflow:hidden}
.sidebar{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:10px}
.sidebar h2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);margin-bottom:8px;padding:0 6px;opacity:.7}
.pipeline-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:5px;cursor:pointer;transition:all .15s}
.pipeline-item:hover{border-color:var(--accent)}.pipeline-item.active{border-color:var(--accent);box-shadow:0 0 10px rgba(124,111,240,.12)}
.pipeline-item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.pipeline-item .title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-right:8px}
.pipeline-item .progress-wrap{display:flex;align-items:center;gap:6px}
.pipeline-item .progress-bar{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.pipeline-item .progress-fill{height:100%;border-radius:2px;transition:width .4s ease;background:var(--accent)}
.pipeline-item .progress-fill.done{background:var(--green)}
.pipeline-item .progress-text{font-size:10px;color:var(--text-dim);min-width:32px;text-align:right}
.pipeline-time{font-size:9px;color:var(--text-dim);margin-top:3px;opacity:.4}
.badge{font-size:10px;padding:1px 7px;border-radius:3px;font-weight:600}
.badge-ready{background:#2a2a40;color:var(--text-dim)}.badge-running{background:#1a3a4a;color:var(--blue)}.badge-done{background:#1a3a2a;color:var(--green)}.badge-blocked{background:#3a2a1a;color:var(--orange)}.badge-crashed{background:#3a1a1a;color:var(--red)}
.main{flex:1;overflow-y:auto;padding:16px 20px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-dim);text-align:center;gap:10px}
.empty-state .icon{font-size:42px;opacity:.4}.empty-state h3{font-size:16px;color:var(--text);font-weight:500}.empty-state p{font-size:13px;max-width:360px}
.pipeline-detail h2{font-size:16px;font-weight:600;margin-bottom:1px;display:flex;align-items:center;gap:8px}.pipeline-detail .subtitle{font-size:11px;color:var(--text-dim);margin-bottom:14px}
.agent-flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:18px}
.agent-card{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;transition:all .3s;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.agent-card .icon{font-size:13px;width:18px;text-align:center}.agent-card .info{display:flex;flex-direction:column}.agent-card .name{font-size:11px;font-weight:600;line-height:1.3}.agent-card .status-label{font-size:10px;font-weight:500;line-height:1.2}.agent-card .duration{font-size:9px;color:var(--text-dim);line-height:1}
.agent-card.s-ready{border-color:var(--border)}.agent-card.s-ready .status-label{color:var(--text-dim)}
.agent-card.s-running{border-color:var(--blue);box-shadow:0 0 6px rgba(108,182,255,.12)}.agent-card.s-running .status-label{color:var(--blue)}
.agent-card.s-done{border-color:var(--green)}.agent-card.s-done .status-label{color:var(--green)}
.agent-card.s-blocked{border-color:var(--orange)}.agent-card.s-blocked .status-label{color:var(--orange)}
.agent-card.s-crashed{border-color:var(--red)}.agent-card.s-crashed .status-label{color:var(--red)}
.agent-card .task-desc{font-size:9px;color:var(--text-dim);line-height:1.3;margin-top:2px;word-break:break-word;grid-column:span 2;white-space:pre-wrap}
.agent-arrow{color:var(--text-dim);font-size:14px;opacity:.5}

/* Horizontal kanban rows */
.kanban-rows{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.kanban-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;align-items:stretch;min-height:44px}
.kanban-row .row-label{width:90px;min-width:90px;padding:8px 10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:space-between;border-right:1px solid var(--border)}
.kanban-row .row-label .count{font-size:9px;background:var(--surface2);padding:1px 6px;border-radius:8px;color:var(--text-dim);margin-left:4px}
.kanban-row .row-cards{flex:1;padding:5px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kanban-row.row-ready .row-label{color:var(--text-dim);background:#1a1a2a}
.kanban-row.row-running .row-label{color:var(--blue);background:#0f1a2a}
.kanban-row.row-blocked .row-label{color:var(--orange);background:#2a1a0f}
.kanban-row.row-done .row-label{color:var(--green);background:#0f2a1a}
.kanban-row.row-crashed .row-label{color:var(--red);background:#2a0f0f}
.kanban-card{display:inline-flex;align-items:flex-start;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:10px;animation:fadeIn .3s ease}
.kanban-card .card-icon{font-size:11px;margin-top:1px}.kanban-card .card-content{display:flex;flex-direction:column;gap:1px;max-width:280px}.kanban-card .card-title{font-weight:500;word-break:break-word;line-height:1.3;white-space:pre-wrap}.kanban-card .card-meta{font-size:8px;color:var(--text-dim)}
.kanban-row .row-empty{font-size:9px;color:var(--text-dim);padding:4px 8px;opacity:.5}

.findings{margin-top:14px}.findings h3{font-size:11px;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}.findings .finding{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 9px;margin-bottom:3px;font-size:11px;line-height:1.4}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
@media(max-width:900px){.sidebar{width:220px;min-width:220px}}@media(max-width:600px){.layout{flex-direction:column}.sidebar{width:100%;min-width:0;max-height:160px}}
</style>
</head>
<body>
<div class="header">
  <h1>⬡ <span>Pipeline</span></h1>
  <div class="status-bar">
    <span id="updateTime">—</span>
    <span id="taskCount">0</span>
    <span class="conn-dot" id="connDot"></span>
    <span id="connStatus">—</span>
  </div>
</div>
<div class="layout">
  <div class="sidebar">
    <h2>Pipelines</h2>
    <div id="pipelineList"></div>
  </div>
  <div class="main">
    <div class="empty-state" id="emptyState">
      <div class="icon">⬡</div>
      <h3>No pipeline runs yet</h3>
      <p>Run a pipeline with <code>pipeline_save()</code> to see agent tasks in real time.</p>
    </div>
    <div class="pipeline-detail" id="pipelineDetail" style="display:none"><div id="detailContent"></div></div>
  </div>
</div>
<script>
let allTasks = [], selectedId = null, es = null;

// XSS-safe HTML escaping
const esc = s => (''+s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]||c);

const BADGE=s=>`<span class="badge badge-${esc(s)}">${esc(s)}</span>`;
const SL=s=>s==='ready'?'⏳':s==='running'?'▶':s==='done'?'✓':s==='blocked'?'⊘':'✗';
const SL_LONG=s=>s==='ready'?'Ready':s==='running'?'Running':s==='done'?'Done':s==='blocked'?'Blocked':'Crashed';
const AGENT_ICON=t=>{const m=(t+'').match(/@(\w+)/);if(!m)return'⬡';const map={finder:'🔍',analyst:'📊',architect:'🏗️',planner:'📋',coder:'💻',reviewer:'👁️',security:'🛡️',integration:'🔗',tester:'🧪',documenter:'📝'};return map[m[1]]||'⚡'};
// Extract agent-specific task from body (falls back to title after agent name)
const AGENT_TASK=ch=>{if(ch.body)return ch.body;return(ch.title||'').split(':').slice(1).join(':').trim()};
function FMT(t){if(!t)return'';const d=new Date(t*1000);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function DUR(c){if(c.status!=='done')return'';const s=c.started_at||c.created_at;const e=c.completed_at;if(!s||!e)return'';const sec=(e-s);return sec<60?sec+'s':Math.round(sec/60)+'m'}
function PIPES(){return allTasks.filter(t=>(t.children||[]).length>0).sort((a,b)=>(b.task||b).created_at-(a.task||a).created_at)}

function RENDER_LIST(){
  const pipes=PIPES(),el=document.getElementById('pipelineList');
  if(!pipes.length){el.innerHTML='<div style="color:var(--text-dim);font-size:12px;padding:8px;text-align:center">No active pipelines</div>';return}
  if(!selectedId&&pipes.length)selectedId=(pipes[0].task||pipes[0]).id;
  el.innerHTML=pipes.map(p=>{
    const t=p.task||p,c=p.children||[];
    const done=c.filter(x=>x.status==='done').length,total=c.length;
    const pct=total?Math.round(done/total*100):0;
    return `<div class="pipeline-item${t.id===selectedId?' active':''}" onclick="SEL('${t.id}')">
      <div class="top"><div class="title">${esc(t.title)}</div>${BADGE(t.status)}</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill${pct===100?' done':''}" style="width:${pct}%"></div></div>
        <span class="progress-text">${done}/${total}</span>
      </div>
      <div class="pipeline-time">${t.created_at?esc(FMT(t.created_at)):''}</div></div>`;
  }).join('');
}

function SEL(id){selectedId=id;RENDER_LIST();RENDER_DETAIL()}

function RENDER_DETAIL(){
  const el=document.getElementById('pipelineDetail'),empty=document.getElementById('emptyState');
  if(!selectedId){el.style.display='none';empty.style.display='flex';return}
  empty.style.display='none';el.style.display='block';
  const data=allTasks.find(t=>(t.task||t).id===selectedId);
  if(!data){document.getElementById('detailContent').innerHTML='<p style="color:var(--text-dim)">Not found</p>';return}
  const t=data.task||data,c=data.children||[],cm=data.comments||[];
  // Agent flow
  let flow='<div class="agent-flow">';
  const agentOrder=(t.pipeline||'').length?t.pipeline:null;
  let ordered=c;
  if(agentOrder)ordered=[...agentOrder.map(a=>c.find(ch=>ch.title&&ch.title.includes(a))).filter(Boolean),...c.filter(ch=>!agentOrder.some(a=>ch.title&&ch.title.includes(a)))];
  ordered.forEach((ch,i)=>{
    if(!ch)return;
    const sc='s-'+(ch.status||'ready');
    const icon=AGENT_ICON(ch.title||'');
    const label=(ch.title||ch.id).split(':')[0];
    flow+=`<div class="agent-card ${sc}"><div class="icon">${icon}</div><div class="info"><div class="name">${esc(label)}</div><div class="status-label">${SL(ch.status)} ${SL_LONG(ch.status)}</div><div class="duration">${FMT(ch.started_at)||DUR(ch)||''}</div></div><div class="task-desc">${esc(AGENT_TASK(ch))}</div></div>`;
    if(i<ordered.length-1&&ordered[i+1])flow+='<div class="agent-arrow">→</div>';
  });
  flow+='</div>';
  // Horizontal kanban rows
  const cols=['ready','running','blocked','done','crashed'];
  let board='<div class="kanban-rows">';
  cols.forEach(col=>{
    const cards=c.filter(ch=>ch.status===col);
    board+=`<div class="kanban-row row-${col}"><div class="row-label"><span>${col}</span><span class="count">${cards.length}</span></div><div class="row-cards">${
      cards.length?cards.map(ch=>`<div class="kanban-card"><span class="card-icon">${AGENT_ICON(ch.title||'')}</span><div class="card-content"><div class="card-title">${esc(AGENT_TASK(ch))}</div><span class="card-meta">${FMT(ch.started_at)?esc(FMT(ch.started_at)):''}${DUR(ch)?' · '+esc(DUR(ch)):''}</span></div></div>`).join(''):'<span class="row-empty">—</span>'
    }</div></div>`;
  });
  board+='</div>';
  // Comments
  let cmt='';
  if(cm.length)cmt='<div class="findings"><h3>Findings</h3>'+cm.map(c=>`<div class="finding">${esc(c.text||c.body||JSON.stringify(c))}</div>`).join('')+'</div>';
  const done=c.filter(ch=>ch.status==='done').length,total=c.length;
  document.getElementById('detailContent').innerHTML=
    `<h2>${esc(t.title)} ${total?`<span style="font-size:11px;font-weight:400;color:var(--text-dim)">${done}/${total}</span>`:''}</h2>
    <div class="subtitle">${BADGE(t.status)} · ${total} agents · ${esc(t.id.slice(0,10))}…</div>
    ${c.length?flow:'<div style="color:var(--text-dim);font-size:12px;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:14px">No agent tasks yet</div>'}
    ${board}${cmt}`;
}

async function REFRESH(){
  try{
    const r=await fetch('/api/refresh');allTasks=await r.json();
    document.getElementById('taskCount').textContent=allTasks.length;
    RENDER_LIST();RENDER_DETAIL();
    document.getElementById('updateTime').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){console.error(e)}
}

function SSE(){
  if(es)es.close();
  const dot=document.getElementById('connDot'),st=document.getElementById('connStatus');
  dot.className='conn-dot conn-pending';st.textContent='...';
  es=new EventSource('/api/events');
  es.addEventListener('task_update',e=>{
    const d=JSON.parse(e.data);const idx=allTasks.findIndex(t=>(t.task||t).id===d.task_id);
    if(idx>=0)allTasks[idx]=d.data;else allTasks.push(d.data);
    document.getElementById('taskCount').textContent=allTasks.length;
    RENDER_LIST();RENDER_DETAIL();
    document.getElementById('updateTime').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  });
  es.addEventListener('task_removed',e=>{
    const d=JSON.parse(e.data);allTasks=allTasks.filter(t=>(t.task||t).id!==d.task_id);
    if(selectedId===d.task_id)selectedId=null;
    document.getElementById('taskCount').textContent=allTasks.length;
    RENDER_LIST();RENDER_DETAIL();
  });
  es.onopen=()=>{dot.className='conn-dot conn-online';st.textContent='live';REFRESH()};
  es.onerror=()=>{dot.className='conn-dot conn-offline';st.textContent='off';setTimeout(SSE,2000)};
}
REFRESH();SSE();
</script>
</body>
</html>
