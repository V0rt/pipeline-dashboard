name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check server.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check server imports and syntax
        run: python3 -c "import server; print('OK — server imports cleanly')"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build
      - run: python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML structure
        run: |
          grep -q '<!DOCTYPE html>' static/index.html
          grep -q '</html>' static/index.html
          echo "HTML OK"
      - name: Check server structure (stdlib-only)
        run: |
          grep -q 'http.server' server.py
          grep -q 'BaseHTTPRequestHandler' server.py
          grep -q 'ThreadingHTTPServer' server.py
          echo "Server is pure stdlib — no FastAPI dependencies needed"
