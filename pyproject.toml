[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-dashboard"
version = "0.1.0"
description = "Real-time web dashboard for Hermes Pipeline Plugin"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pipeline-dashboard = "server:main"

[tool.setuptools.packages.find]
include = ["server*"]
